spring:
  elasticsearch:
    uris: http://localhost:9200
  application:
    name: search-api
  threads:
    virtual:
      enabled: true

server:
  port: 8080

elasticsearch:
  index: npm-packages

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: ecs
