spring:
  elasticsearch:
    uris: http://localhost:9200
  application:
    name: search-api
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null # omit null fields from JSON responses
  mvc:
    problemdetails:
      enabled: true # framework errors (400, 404, 405...) come back as ProblemDetail

server:
  port: 8080

elasticsearch:
  index: npm-packages

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: ecs
