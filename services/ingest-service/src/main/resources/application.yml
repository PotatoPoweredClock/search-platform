spring:
  elasticsearch:
    uris: http://localhost:9200
  application:
    name: ingest-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/search_platform?reWriteBatchedInserts=true
    username: search_platform
    password: search_platform
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema, Hibernate only checks it matches the entities
  flyway:
    enabled: true
    locations: classpath:db/migration

elasticsearch:
  index: npm-packages

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: ecs
